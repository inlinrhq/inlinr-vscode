name: ci

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.6
      - name: Lint and format
        run: biome ci .

      # No credit to an AI assistant in the commits or the branch
      # (7IBO/socle, code/git.md): .githooks/commit-msg. Not the body: the
      # event keeps the body the PR opened with, so an edit is never seen.
      - name: No attribution
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
          BRANCH: ${{ github.head_ref }}
        run: sh .githooks/commit-msg --ci
