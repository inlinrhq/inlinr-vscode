# Publish inlinr-vscode to VS Code Marketplace + OpenVSX on every `v*` tag.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VSCE_PAT  — Azure DevOps PAT with Marketplace > Manage scope
#   OVSX_PAT  — OpenVSX personal token with `publish` scope

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release + upload .vsix

# Actions pinned to a commit: this job holds both marketplace tokens, and a
# moved tag cannot change what runs with them.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Package .vsix
        run: bunx vsce package --no-dependencies -o inlinr-vscode-${{ github.ref_name }}.vsix

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --no-dependencies --skip-duplicate --packagePath inlinr-vscode-${{ github.ref_name }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to OpenVSX
        run: bunx ovsx publish inlinr-vscode-${{ github.ref_name }}.vsix --skip-duplicate -p $OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: inlinr-vscode-${{ github.ref_name }}.vsix
          generate_release_notes: true
